name: Portable core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/core --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/core -C Release --output-on-failure
